<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dreamare Scene Editor</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <aside id="panel">
    <input id="sceneName" class="scenename" spellcheck="false" title="the scene's name" />
    <p id="sceneMeta" class="meta"></p>
    <div class="buttons" hidden id="sceneButtons">
      <button id="save" class="primary" title="save this scene (updates it if it was saved before)">Save scene</button>
      <button id="saveAs" title="save as a new scene">Save as new</button>
      <button id="newScene" title="start an empty scene">New scene</button>
      <button id="fullscreen">Full screen</button>
      <button id="exportGlb" title="the whole scene as one GLB: terrain + characters in their pose">Export GLB</button>
      <button id="exportFile" title="a scene file with the characters inside, to load here or elsewhere">Export file</button>
      <button id="importFile" style="grid-column: span 2">Import scene file…</button>
      <input type="file" id="importInput" accept=".json,application/json" hidden />
      <button id="playScene" class="primary" title="everyone with a voice line speaks (P)">▶ Play scene</button>
      <button id="record" title="record a vertical 1080x1920 clip with the voices and subtitles (click again to stop and save)">● Rec (vertical)</button>
      <button id="walkMode" title="walk around with WASD, look with the mouse">Walk (WASD)</button>
      <button id="snapshot" title="a clean vertical 1080x1920 picture of this view, for the Slides tab (K)">📷 Snapshot</button>
    </div>
    <details open><summary>Terrain</summary><div id="terrainBox"></div></details>
    <details open><summary>Characters in the scene</summary><div id="actorList"></div><div id="actorBox"></div></details>
    <details open><summary>Poses</summary><div id="poseLib" class="library"></div></details>
    <details open><summary>Library</summary><div id="library" class="library"></div></details>
    <details open><summary>Mood</summary><div id="moodBox"></div></details>
    <details open><summary>Shots</summary><div id="shotBox"></div></details>
    <details open><summary>Camera</summary><div id="camHud" class="camhud"></div></details>
    <details open><summary>Saved scenes</summary><div id="sceneList"></div></details>
  </aside>
  <main>
    <section id="stage"><div class="viewwrap"><canvas id="view"></canvas><div id="captions" class="captions"></div></div>
      <aside class="sidepanel"><h2>Ambience</h2><div id="ambienceList"></div><p class="meta">CC0 field recordings (public/ambience/CREDITS.md). Beds loop with a 2 s crossfade and go into recordings.</p></aside>
    </section>
    <p id="status">drag to turn · click a character to select it, then drag it to move · Q / E turn it · Delete removes</p>
  </main>
  <script type="module" src="/src/editor/main.js"></script>
</body>
</html>
