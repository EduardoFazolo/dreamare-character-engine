<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dreamare Character Engine</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <aside id="panel">
    <div class="buttons">
      <div class="facemode" title="what Randomize makes: people (photo faces, optionally masked) or animal faces"><button id="modeHuman" class="on">Human</button><button id="modeAnimal">Animal</button></div>
      <div class="rand"><button id="randomize">Randomize</button><label title="also pick a random face photo"><input type="checkbox" id="randPhoto" checked /> photo</label><label title="also pick a random pose (off: Randomize keeps the current pose)"><input type="checkbox" id="randPose" checked /> pose</label><label title="old console bodies: few flat-shaded faces, squared cross-sections (Randomize keeps it)"><input type="checkbox" id="boxy" /> boxy</label><label title="clothes first: each outfit's cut (fit, shoulders, flare, length) shapes the garments and nudges the body (Randomize keeps it)"><input type="checkbox" id="fitted" /> fitted clothes</label><label id="maskSwitch" title="let Randomize put masks on the faces (off: no masks, and the current one comes off)"><input type="checkbox" id="randMask" checked /> masks</label><label title="let Randomize give monocles, glasses, cigars, cigarettes and pipes (off: none, and the current one goes)"><input type="checkbox" id="randGadget" checked /> gadgets</label></div>
      <label title="show every polygon over the shaded character"><input type="checkbox" id="wire" /> wireframe</label>
      <button id="roll">Roll 12</button>
      <button id="reset">Reset</button>
      <button id="export">Export face texture</button>
      <button id="exportGlb">Export character</button>
      <button id="sendScene" class="primary" style="grid-column: span 2" title="add this character to the scene editor's current scene (press again for another)">Send to scene ▸</button>
    </div>
    <div id="controls"></div>
  </aside>
  <main>
    <section id="sources">
      <div id="faces"></div>
      <label class="drop" id="drop">+ drop / pick face photos<input type="file" id="file" accept="image/*" multiple hidden /></label>
    </section>
    <section id="stage">
      <canvas id="view"></canvas>
      <div id="atlasBox">
        <canvas id="atlas"></canvas>
        <span>face texture (canonical UV)</span>
        <canvas id="bodyAtlas"></canvas>
        <span id="bodyInfo">body texture (baked)</span>
      </div>
    </section>
    <p id="status">loading face model…</p>
    <section id="gallery"></section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
