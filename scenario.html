<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dreamare Scenarios</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <aside id="panel">
    <h1>DREAMARE</h1>
    <nav class="tabs"><a href="/">Characters</a><a class="on" href="/scenario.html">Scenarios</a><a href="/names.html">Names</a></nav>
    <p id="placeName" class="placename" title="click to show the title card again"></p>
    <div class="buttons">
      <button id="randomize">Randomize</button>
      <button id="reset">Reset</button>
      <label title="slowly drift the camera around"><input type="checkbox" id="drift" checked /> drift</label>
      <label title="show every polygon"><input type="checkbox" id="wire" /> wireframe</label>
      <button id="walkMode" title="walk around with WASD, look with the mouse">Walk (WASD)</button>
      <button id="fullscreen" title="full screen (Esc to leave)">Full screen</button>
      <button id="record" style="grid-column: span 2" title="record a vertical 1080x1920 clip with sound (click again to stop and save)">● Rec (vertical)</button>
      <button id="sound" style="grid-column: span 2" title="the song plays from the phone booth">Sound: click to start</button>
      <button id="exportGlb" style="grid-column: span 2">Export scenario (GLB)</button>
    </div>
    <div id="controls"></div>
  </aside>
  <main>
    <section id="stage"><canvas id="view"></canvas></section>
    <p id="status">drag to look around · wheel to zoom</p>
  </main>
  <script type="module" src="/src/scenario/main.js"></script>
</body>
</html>
